<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Sender</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1c2430; --muted: #6b7684; --line: #e3e8ee;
    --green: #1fa855; --green-d: #17863f; --sent: #9aa5b1; --accent: #0b6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a212a; --text: #e8edf2; --muted: #93a0ae; --line: #2a3340; --sent: #5d6977; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; flex: 1 1 auto; }
  select, .ghost { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .ghost { cursor: pointer; }
  .stats { max-width: 760px; margin: 6px auto 0; color: var(--muted); font-size: 13px; }
  .chips { max-width: 760px; margin: 10px auto 0; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .chip { flex: 0 0 auto; min-width: 48px; text-align: center; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); color: var(--text); font-size: 18px; font-weight: 600; cursor: pointer; }
  .chip.done { background: var(--green); border-color: var(--green); color: #fff; }
  .chip.active { outline: 2px solid var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; scroll-margin-top: 170px; }
  summary { cursor: pointer; padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; margin-right: 8px; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary .count { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .row .idx { color: var(--muted); font-size: 12px; width: 22px; text-align: right; flex: 0 0 auto; }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .num { display: block; color: var(--muted); font-size: 12px; }
  .row.sent .name { color: var(--sent); }
  .send { flex: 0 0 auto; background: var(--green); color: #fff; text-decoration: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .send:hover { background: var(--green-d); }
  .row.sent .send { background: transparent; color: var(--sent); border: 1px solid var(--line); }
  .row.sent .send::after { content: " ✓"; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>WhatsApp Sender</h1>
    <select id="jump" aria-label="Jump to section"></select>
    <button class="ghost" id="reset" title="Clear all sent marks">Reset</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips"></div>
</header>
<main id="list"></main>

<script src="data.js"></script>
<script>
(function () {
  var PER = 50;
  var C = window.CONTACTS || [], M = window.MESSAGES || [];
  var KEY = 'wa-sent-v1';
  var sent = {};
  try { sent = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(sent)); } catch (e) {} }

  var lastIdx = -1;
  function pickMessage(name) {
    var i;
    do { i = Math.floor(Math.random() * M.length); } while (M.length > 1 && i === lastIdx);
    lastIdx = i;
    return M[i].replace(/\{name\}/gi, name || 'there');
  }

  var sections = [];
  for (var i = 0; i < C.length; i += PER) sections.push(C.slice(i, i + PER));

  var list = document.getElementById('list');
  var jump = document.getElementById('jump');
  var chips = document.getElementById('chips');
  var stats = document.getElementById('stats');

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  sections.forEach(function (rows, s) {
    var d = document.createElement('details');
    d.id = 'sec' + (s + 1);
    var html = '<summary>Section ' + (s + 1) + '<span class="count"></span></summary>';
    rows.forEach(function (c, k) {
      html += '<div class="row" data-p="' + c.p + '"><span class="idx">' + (s * PER + k + 1) + '</span>' +
        '<span class="name">' + esc(c.n || c.p) + '<span class="num">+' + c.p + '</span></span>' +
        '<a class="send" href="#" target="_blank" rel="noopener">Send</a></div>';
    });
    d.innerHTML = html;
    list.appendChild(d);

    var o = document.createElement('option');
    o.value = s + 1; o.textContent = 'Section ' + (s + 1);
    jump.appendChild(o);

    var ch = document.createElement('button');
    ch.className = 'chip'; ch.textContent = s + 1; ch.dataset.s = s + 1;
    chips.appendChild(ch);
  });

  function refresh() {
    var total = 0;
    sections.forEach(function (rows, s) {
      var d = document.getElementById('sec' + (s + 1)), n = 0;
      d.querySelectorAll('.row').forEach(function (r) {
        var is = !!sent[r.dataset.p];
        r.classList.toggle('sent', is);
        if (is) n++;
      });
      total += n;
      d.querySelector('.count').textContent = n + ' / ' + rows.length + ' sent';
      chips.children[s].classList.toggle('done', n === rows.length);
    });
    stats.textContent = total + ' of ' + C.length + ' sent · ' + sections.length + ' sections · ' + M.length + ' message variants';
  }

  function goTo(n) {
    var d = document.getElementById('sec' + n);
    if (!d) return;
    d.open = true;
    jump.value = n;
    Array.prototype.forEach.call(chips.children, function (c) { c.classList.toggle('active', c.dataset.s == n); });
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  jump.addEventListener('change', function () { goTo(jump.value); });
  chips.addEventListener('click', function (e) { if (e.target.dataset.s) goTo(e.target.dataset.s); });

  // Build the wa.me link at click time so each click gets a different message variant.
  list.addEventListener('click', function (e) {
    var a = e.target.closest('a.send');
    if (!a) return;
    var row = a.closest('.row');
    var name = row.querySelector('.name').firstChild.textContent.trim();
    var c = C.filter(function (x) { return x.p === row.dataset.p; })[0];
    a.href = 'https://wa.me/' + row.dataset.p + '?text=' + encodeURIComponent(pickMessage(c && c.n ? c.n : ''));
    sent[row.dataset.p] = Date.now();
    save();
    setTimeout(refresh, 0);
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (confirm('Clear all "sent" marks?')) { sent = {}; save(); refresh(); }
  });

  refresh();
  if (sections.length) goTo(1);
  window.scrollTo(0, 0);
})();
</script>
</body>
</html>
